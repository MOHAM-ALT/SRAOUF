<?xml version="1.0"?>
<!-- 
╔════════════════════════════════════════════════════════════════╗
║          سراوف - إعدادات أنظمة المحاكيات المثالية             ║
║      SRAOUF - EmulationStation Systems Configuration           ║
║                    الإصدار: 3.0 - مصحح                        ║
╚════════════════════════════════════════════════════════════════╝
-->
<systemList>

    <!-- ════════════════════════════════════════════════════════════ -->
    <!-- نينتندو إنترتينمنت سيستم - Nintendo Entertainment System -->
    <!-- ════════════════════════════════════════════════════════════ -->
    <system>
        <name>nes</name>
        <fullname>Nintendo Entertainment System</fullname>
        <path>~/SRAOUF/games/nintendo-nes</path>
        <extension>.nes .NES .zip .ZIP .7z .7Z</extension>
        <command>retroarch -L /usr/lib/*/libretro/nestopia_libretro.so --config ~/SRAOUF/configs/retroarch.cfg "%ROM%"</command>
        <platform>nes</platform>
        <theme>nes</theme>
        <description>وحدة تحكم الألعاب الكلاسيكية من نينتندو</description>
    </system>

    <!-- ════════════════════════════════════════════════════════════ -->
