        <command>retroarch -L /usr/lib/*/libretro/snes9x_libretro.so --config ~/SRAOUF/configs/retroarch.cfg "%ROM%"</command>
        <platform>snes</platform>
        <theme>snes</theme>
        <description>وحدة تحكم نينتندو 16-بت المتقدمة</description>
    </system>

