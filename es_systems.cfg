#!/bin/bash

# ╔════════════════════════════════════════════════════════════════╗
# ║          سراوف - أداة البحث الذكية عن الألعاب                  ║
# ║          SRAOUF - Smart Game Finder & Loader                   ║
# ║                    الإصدار: 3.0                                ║
# ╚════════════════════════════════════════════════════════════════╝

set -e

# الألوان
أحمر='\033[0;31m'
أخضر='\033[0;32m'
أصفر='\033[1;33m'
أزرق='\033[0;34m'
بنفسجي='\033[0;35m'
سماوي='\033[0;36m'
عادي='\033[0m'

# المتغيرات
مجلد_سراوف="$HOME/SRAOUF"
مجلد_الألعاب="$مجلد_سراوف/games"
ملف_السجل="$مجلد_سراوف/logs/game_scanner.log"
ملف_الألعاب_المكتشفة="$مجلد_سراوف/logs/games_found.txt"

# ╔════════════════════════════════════════════════════════════════╗
# ║                    دوال الطباعة بالعربية                       ║
# ╚════════════════════════════════════════════════════════════════╝

طباعة_عنوان() {
    echo -e "${بنفسجي}${BOLD}"
    echo "╔════════════════════════════════════════════╗"
    echo "║  $1"
    echo "╚════════════════════════════════════════════╝"
    echo -e "${عادي}"
}

طباعة_خطوة() {
    echo -e "${سماوي}▶ $1${عادي}"
}

طباعة_نجاح() {
    echo -e "${أخضر}✅ $1${عادي}"
}

طباعة_خطأ() {
    echo -e "${أحمر}❌ $1${عادي}"
}

طباعة_تحذير() {
    echo -e "${أصفر}⚠️  $1${عادي}"
}

طباعة_معلومة() {
    echo -e "${أزرق}ℹ️  $1${عادي}"
}

# ╔════════════════════════════════════════════════════════════════╗
# ║                  البحث عن الألعاب في النظام كاملاً             ║
# ╚════════════════════════════════════════════════════════════════╝

البحث_الشامل_عن_الألعاب() {
    طباعة_خطوة "البحث الشامل عن ملفات الألعاب في كل مكان..."
    
    local عدد_الألعاب=0
    local الملفات_المكتشفة=()
    
    # قائمة الامتدادات المطلوبة
    local امتدادات=(
        "*.nes" "*.sfc" "*.smc" "*.gb" "*.gbc" "*.gba" "*.n64" "*.z64"
        "*.bin" "*.gen" "*.md" "*.sms" "*.gg" "*.zip" "*.7z"
        "*.iso" "*.cue" "*.a26" "*.rom" "*.prg" "*.tap" "*.d64"
    )
    
    echo "" >> "$ملف_الألعاب_المكتشفة"
    echo "📅 البحث في: $(date)" >> "$ملف_الألعاب_المكتشفة"
    echo "════════════════════════════════════════" >> "$ملف_الألعاب_المكتشفة"
    echo "" >> "$ملف_الألعاب_المكتشفة"
    
    # البحث في مجلد المستخدم الرئيسي وفقط
    طباعة_معلومة "البحث في: $HOME"
    
    for ext in "${امتدادات[@]}"; do
        while IFS= read -r -d '' ملف; do
            if [[ -f "$ملف" ]]; then
                ((عدد_الألعاب++))
                الملفات_المكتشفة+=("$ملف")
                local اسم_ملف=$(basename "$ملف")
                local حجم_ملف=$(du -h "$ملف" | cut -f1)
                echo "  🎮 $اسم_ملف [$حجم_ملف]"
                echo "$ملف | $اسم_ملف | $حجم_ملف" >> "$ملف_الألعاب_المكتشفة"
            fi
        done < <(find "$HOME" -type f -iname "$ext" -print0 2>/dev/null)
    done
    
    طباعة_نجاح "تم العثور على $عدد_الألعاب لعبة"
    
    # تخزين النتائج
    echo "الألعاب المكتشفة: $عدد_الألعاب" >> "$ملف_السجل"
    
    return "$عدد_الألعاب"
}

# ╔════════════════════════════════════════════════════════════════╗
# ║                   تصنيف الألعاب حسب النوع                      ║
# ╚════════════════════════════════════════════════════════════════╝

تصنيف_الألعاب() {
    طباعة_خطوة "تصنيف الألعاب حسب النوع..."
    
    mkdir -p "$مجلد_الألعاب"
    
    # تعريفات الأنظمة
    declare -A الأنظمة=(
        ["nintendo-nes"]="\.nes$"
        ["nintendo-snes"]="\.(sfc|smc)$"
        ["nintendo-gb"]="\.gb$"
        ["nintendo-gbc"]="\.gbc$"
        ["nintendo-gba"]="\.gba$"
        ["nintendo-n64"]="\.(n64|z64)$"
        ["sega-genesis"]="\.(bin|gen|md)$"
        ["sega-mastersystem"]="\.sms$"
        ["sega-gamegear"]="\.gg$"
        ["arcade-mame"]="\.zip$"
        ["sony-psx"]="\.(iso|cue|bin)$"
        ["atari-2600"]="\.a26$"
        ["commodore-64"]="\.(tap|d64)$"
    )
    
    # إنشاء المجلدات وتصنيف الملفات
    for نظام in "${!الأنظمة[@]}"; do
        local نمط="${الأنظمة[$نظام]}"
        mkdir -p "$مجلد_الألعاب/$نظام"
        
        # البحث عن ملفات تطابق هذا النمط
        while IFS= read -r -d '' ملف; do
            if [[ "$ملف" =~ $نمط ]]; then
                cp "$ملف" "$مجلد_الألعاب/$نظام/" 2>/dev/null || true
                طباعة_معلومة "📦 نسخ: $(basename "$ملف") ← $نظام"
            fi
        done < <(find "$HOME" -type f \( -iname "*.nes" -o -iname "*.sfc" -o -iname "*.smc" -o -iname "*.gb" -o -iname "*.gbc" -o -iname "*.gba" -o -iname "*.bin" -o -iname "*.gen" -o -iname "*.md" -o -iname "*.sms" -o -iname "*.gg" -o -iname "*.zip" -o -iname "*.iso" -o -iname "*.cue" -o -iname "*.a26" -o -iname "*.tap" -o -iname "*.d64" \) -print0 2>/dev/null)
    done
    
    طباعة_نجاح "تم تصنيف جميع الألعاب"
}

# ╔════════════════════════════════════════════════════════════════╗
# ║                   إنشاء تقرير الألعاب المكتشفة                 ║
# ╚════════════════════════════════════════════════════════════════╝

إنشاء_تقرير() {
    طباعة_خطوة "إنشاء تقرير الألعاب..."
    
    local تقرير="$مجلد_سراوف/logs/games_report.txt"
    
    cat > "$تقرير" << 'EOF'
╔════════════════════════════════════════════════════════════════╗
║           تقرير الألعاب المكتشفة والمثبتة                      ║
║          Installed and Detected Games Report                   ║
╚════════════════════════════════════════════════════════════════╝

EOF

    echo "التاريخ والوقت: $(date)" >> "$تقرير"
    echo "" >> "$تقرير"
    
    # إحصائيات لكل نظام
    echo "📊 إحصائيات الألعاب بالنظام:" >> "$تقرير"
    echo "════════════════════════════════════════" >> "$تقرير"
    echo "" >> "$تقرير"
    
    for مجلد_نظام in "$مجلد_الألعاب"/*/; do
        if [[ -d "$مجلد_نظام" ]]; then
            local اسم_النظام=$(basename "$مجلد_نظام")
            local عدد_الملفات=$(find "$مجلد_نظام" -type f | wc -l)
            
            if [[ $عدد_الملفات -gt 0 ]]; then
                echo "🎮 $اسم_النظام: $عدد_الملفات لعبة" >> "$تقرير"
                
                # قائمة الألعاب
                find "$مجلد_نظام" -type f -exec basename {} \; >> "$تقرير"
                echo "" >> "$تقرير"
            fi
        fi
    done
    
    echo "" >> "$تقرير"
    echo "════════════════════════════════════════" >> "$تقرير"
    echo "✅ تم إنشاء التقرير بنجاح" >> "$تقرير"
    
    طباعة_نجاح "التقرير: $تقرير"
}

# ╔════════════════════════════════════════════════════════════════╗
# ║                   اختبار النوى والمحاكيات                      ║
# ╚════════════════════════════════════════════════════════════════╝

اختبار_النوى() {
    طباعة_خطوة "فحص توفر نوى المحاكيات..."
    
    local النوى_المطلوبة=(
        "nestopia_libretro.so:Nintendo NES"
        "snes9x_libretro.so:Super Nintendo"
        "gambatte_libretro.so:Game Boy"
        "mgba_libretro.so:Game Boy Advance"
        "genesis_plus_gx_libretro.so:Sega Genesis"
        "pcsx_rearmed_libretro.so:PlayStation 1"
        "stella_libretro.so:Atari 2600"
        "mame_libretro.so:Arcade MAME"
    )
    
    echo ""
    echo "🔍 فحص النوى المتاحة:"
    echo "════════════════════════════════════════"
    
    for نواة in "${النوى_المطلوبة[@]}"; do
        local اسم_النواة="${نواة%:*}"
        local اسم_النظام="${نواة#*:}"
        
        if find /usr/lib -name "$اسم_النواة" 2>/dev/null | grep -q .; then
            طباعة_نجاح "$اسم_النظام: موجودة ✓"
        else
            طباعة_تحذير "$اسم_النظام: غير موجودة (يمكن تثبيتها)"
        fi
    done
    
    echo ""
}

# ╔════════════════════════════════════════════════════════════════╗
# ║                       الدالة الرئيسية                          ║
# ╚════════════════════════════════════════════════════════════════╝

الدالة_الرئيسية() {
    clear
    
    طباعة_عنوان "أداة البحث الذكية عن الألعاب"
    
    mkdir -p "$(dirname "$ملف_السجل")"
    mkdir -p "$(dirname "$ملف_الألعاب_المكتشفة")"
    
    # مسح الملفات القديمة
    > "$ملف_الألعاب_المكتشفة"
    
    echo "$(date): بدء البحث عن الألعاب" >> "$ملف_السجل"
    echo ""
    
    # تنفيذ الخطوات
    البحث_الشامل_عن_الألعاب
    echo ""
    
    تصنيف_الألعاب
    echo ""
    
    اختبار_النوى
    echo ""
    
    إنشاء_تقرير
    echo ""
    
    # التقرير النهائي
    echo -e "${أخضر}"
    echo "╔════════════════════════════════════════════╗"
    echo "║   ✅ تم انتهاء البحث والفحص بنجاح!       ║"
    echo "║    Search and Scan Completed Successfully! ║"
    echo "╚════════════════════════════════════════════╝"
    echo -e "${عادي}"
    echo ""
    
    طباعة_نجاح "الألعاب متوفرة في: $مجلد_الألعاب"
    طباعة_نجاح "التقرير الكامل: $مجلد_سراوف/logs/games_report.txt"
    طباعة_نجاح "الملفات المكتشفة: $ملف_الألعاب_المكتشفة"
    echo ""
    
    طباعة_معلومة "📍 الخطوة التالية:"
    echo "   1️⃣  تشغيل: emulationstation"
    echo "   2️⃣  أو: retroarch --menu"
    echo ""
    
    echo "$(date): البحث اكتمل بنجاح" >> "$ملف_السجل"
}

# التشغيل
الدالة_الرئيسية "$@"
