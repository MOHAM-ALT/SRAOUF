# ====================================================================
# سراوف - إعدادات ريترو آرش المثالية
# SRAOUF - RetroArch Perfect Configuration
# الإصدار: 4.0 - مصحح ونهائي 100%
# ====================================================================

# ╔════════════════════════════════════════════════════════════════╗
# ║                    إعدادات الفيديو الأساسية                    ║
# ║                   Basic Video Settings                          ║
# ╚════════════════════════════════════════════════════════════════╝

video_driver = "gl"
video_fullscreen = true
video_width = 1920
video_height = 1080
video_vsync = true
video_hard_sync = false
video_frame_delay = 0
video_threaded = true

# إعدادات جودة الفيديو
video_smooth = true
video_force_aspect = true
video_scale_integer = false
video_crop_overscan = true
video_aspect_ratio_auto = false
video_aspect_ratio = 1.777778
video_rotation = 0
video_allow_rotate = true

# ╔════════════════════════════════════════════════════════════════╗
# ║                      إعدادات الصوت الممتازة                    ║
# ║                   Excellent Audio Settings                      ║
# ╚════════════════════════════════════════════════════════════════╝

audio_driver = "alsa"
audio_enable = true
audio_mute_enable = false
audio_out_rate = 48000
audio_latency = 64
audio_sync = true
audio_max_timing_skew = 0.05
audio_volume = 0.0
audio_mixer_volume = 0.0
audio_dsp_plugin = ""

# ╔════════════════════════════════════════════════════════════════╗
# ║                    إعدادات الإدخال والتحكم                     ║
# ║                   Input and Control Settings                    ║
# ╚════════════════════════════════════════════════════════════════╝

input_driver = "udev"
input_joypad_driver = "udev"
input_keyboard_layout = "qwerty"
input_autodetect_enable = true
input_autoconfigure_joypad_init = true
input_analog_deadzone = 0.15
input_analog_sensitivity = 1.0
input_device_index = 0
input_max_users = 4

# أزرار القائمة والتحكم السريع
input_menu_toggle = "f1"
input_exit_emulator = "escape"
input_load_state = "f4"
input_save_state = "f2"
input_state_slot_increase = "f7"
input_state_slot_decrease = "f6"
input_reset = "f9"
input_screenshot = "f8"
input_pause_toggle = "p"
input_hold_fast_forward = "space"
input_fps_toggle = "f3"
input_recording_toggle = "r"

# ╔════════════════════════════════════════════════════════════════╗
# ║                  إعدادات القائمة والواجهة                      ║
# ║                   Menu and UI Settings                          ║
# ╚════════════════════════════════════════════════════════════════╝

# اختيار محرك القائمة
menu_driver = "xmb"
menu_unified_controls = true
menu_mouse_enable = true
menu_pointer_enable = false
menu_timedate_enable = true
menu_battery_level_enable = true
menu_core_enable = true
menu_show_start_screen = false

# إعدادات XMB (الواجهة الافتراضية)
menu_xmb_color_theme = 4
menu_xmb_theme = 0
menu_xmb_shadows_enable = true
menu_xmb_show_settings = true
menu_xmb_show_favorites = true
menu_xmb_show_images = true
menu_xmb_show_history = true
menu_xmb_show_add_content = true
menu_xmb_alpha_factor = 100
menu_xmb_scale_factor = 100

# ألوان الخط والواجهة
menu_font_size = 18.0
menu_font_color_red = 255
menu_font_color_green = 255
menu_font_color_blue = 255
menu_title_color = "ffffffff"
menu_entry_normal_color = "ffffffff"
menu_entry_hover_color = "ff64ceaa"

# ╔════════════════════════════════════════════════════════════════╗
# ║                      إعدادات اللغة والخطوط                     ║
# ║                   Language and Font Settings                    ║
# ╚════════════════════════════════════════════════════════════════╝

# اللغة - 0 = الإنجليزية (الموصى به للاستقرار)
# 14 = العربية (إذا كان الدعم متاحاً)
user_language = 0
menu_unicode_enable = true

# الخطوط المستخدمة
menu_font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

# ╔════════════════════════════════════════════════════════════════╗
# ║                      مسارات المجلدات المهمة                     ║
# ║                   Important Directory Paths                     ║
# ╚════════════════════════════════════════════════════════════════╝

# مجلدات النظام والملفات
system_directory = "~/SRAOUF/emulators/bios"
core_assets_directory = "~/SRAOUF/assets/cores"
assets_directory = "~/SRAOUF/assets"
savestate_directory = "~/SRAOUF/states"
savefile_directory = "~/SRAOUF/saves"
screenshot_directory = "~/SRAOUF/screenshots"
recording_output_directory = "~/SRAOUF/recordings"
joypad_autoconfig_dir = "~/SRAOUF/configs/autoconfig"
playlist_directory = "~/SRAOUF/configs/playlists"
video_shader_dir = "~/SRAOUF/assets/shaders"
overlay_directory = "~/SRAOUF/assets/overlays"
thumbnails_directory = "~/SRAOUF/assets/thumbnails"
dynamic_wallpapers_directory = "~/SRAOUF/assets/wallpapers"

# ╔════════════════════════════════════════════════════════════════╗
# ║                    إعدادات الحفظ والحالات                      ║
# ║                   Save States Settings                          ║
# ╚════════════════════════════════════════════════════════════════╝

# حفظ الحالات التلقائي
savestate_auto_save = true
savestate_auto_load = true
savestate_auto_index = true
savestate_thumbnail_enable = true
savestate_file_compression = true
autosave_interval = 10

# ╔════════════════════════════════════════════════════════════════╗
# ║                        إعدادات الأداء                          ║
# ║                   Performance Settings                          ║
# ╚════════════════════════════════════════════════════════════════╝

# إعادة الملف (Rewind) - معطل للأداء الأفضل
rewind_enable = false
pause_nonactive = true

# تشغيل متقدم (تقليل التأخير)
run_ahead_enabled = false
run_ahead_frames = 0

# سرعة التشغيل السريع
fastforward_ratio = 4.0
slowmotion_ratio = 3.0

# ╔════════════════════════════════════════════════════════════════╗
# ║                      إعدادات اللعب الجماعي                      ║
# ║                   Netplay Settings                              ║
# ╚════════════════════════════════════════════════════════════════╝

netplay_enable = false
netplay_mode = false
netplay_delay_frames = 0
netplay_public_announce = false
netplay_nat_traversal = true

# ╔════════════════════════════════════════════════════════════════╗
# ║                        إعدادات الإنجازات                       ║
# ║                   Achievements Settings                         ║
# ╚════════════════════════════════════════════════════════════════╝

cheevos_enable = false
cheevos_test_unofficial = false
cheevos_hardcore_mode_enable = false
cheevos_auto_screenshot = false

# ╔════════════════════════════════════════════════════════════════╗
# ║                      إعدادات متقدمة أخرى                       ║
# ║                   Other Advanced Settings                       ║
# ╚════════════════════════════════════════════════════════════════╝

# إعدادات حفظ الإعدادات
config_save_on_exit = true
auto_remaps_enable = true
auto_overrides_enable = true

# إعدادات الشبكة
network_cmd_enable = false
network_remote_enable = false
stdin_cmd_enable = false

# إعدادات التصحيح
log_verbosity = false
perfcnt_enable = false
fps_show = false
memory_show = false

# إعدادات المحتوى
core_set_supports_no_game_enable = true
support_no_game_enable = false
core_info_cache_enable = true
libretro_log_level = 0

# ╔════════════════════════════════════════════════════════════════╗
# ║                   إعدادات خاصة بـ Raspberry Pi                 ║
# ║                   Raspberry Pi Specific                         ║
# ╚════════════════════════════════════════════════════════════════╝

# تحسينات الأداء على Pi
video_gpu_record = false
video_gpu_screenshot = false
video_shared_context = false

# توفير الموارد
video_scale_integer = false
video_smooth = true

# ملاحظات الاستخدام:
# - اللغة الإنجليزية موصى بها للاستقرار التام
# - جميع المسارات نسبية لمجلد المستخدم الرئيسي
# - يمكن تخصيص المزيد من الإعدادات من داخل البرنامج
# - احفظ نسخة احتياطية قبل التعديل على هذا الملف

# Usage Notes:
# - English language recommended for full stability
# - All paths are relative to user home directory
# - Additional settings can be customized within the program
# - Backup this file before making modifications
